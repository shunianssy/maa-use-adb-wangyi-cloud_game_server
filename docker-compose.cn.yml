# 网易云游戏 MAA - 中国大陆网络加速版编排
#
# 一键部署 / 更新(在项目目录执行):
#   git pull
#   docker compose -f docker-compose.cn.yml up -d --build
#
# 常用命令:
#   docker compose -f docker-compose.cn.yml logs -f          # 查看日志
#   docker compose -f docker-compose.cn.yml down             # 停止并删除容器
#   docker compose -f docker-compose.cn.yml build --no-cache # 忽略缓存重新构建
#
# 加速说明:
#   - 构建期: Debian APT 与 PyPI 均使用阿里云镜像(build.args)
#   - 运行期: MAA 核心/资源下载使用 ghfast.top 镜像(首次启动自动拉取)
#   - Docker 基础镜像(python:3.12-slim)请在 Docker daemon 配置阿里云镜像加速器,
#     方式见 README「中国大陆网络加速」章节
services:
  netease-maa:
    build:
      context: .
      # 若构建阶段出现域名解析失败(DNS 问题), 可取消下一行注释改用宿主网络后重试
      network: host
      args:
        # Debian APT 镜像(阿里云, 使用 HTTPS + 构建时强制 IPv4, 避免国内网络下 Ign/Err)
        APT_MIRROR: mirrors.aliyun.com
        APT_MIRROR_SCHEME: https
        # PyPI 镜像(阿里云)
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
        PIP_TRUSTED_HOST: mirrors.aliyun.com
    image: netease-cloud-game-maa
    container_name: netease-cloud-game-maa
    ports:
      - "22888:22888"
    environment:
      # 容器内必须监听 0.0.0.0, 否则宿主机无法访问
      - NETEASE_HOST=0.0.0.0
      - NETEASE_PORT=22888
      - NETEASE_GAME_CODE=mrfz
      # 运行时状态(设置/token/账号配置/日志)统一放在持久化目录 /app/data,
      # 配合下方 ./data 卷挂载, 使更新重建后配置不会丢失。
      - NETEASE_MAA_SETTINGS=/app/data/maa_settings.json
      - NETEASE_TOKEN_FILE=/app/data/token
      - NETEASE_ACCOUNTS_FILE=/app/data/accounts.json
      - NETEASE_ACCOUNT_SETTINGS_FILE=/app/data/account_settings.json
      - MAA_LOG_DIR=/app/data/logs
      # MAA 核心/资源下载镜像(国内加速); 留空则直连 GitHub(失败会自动尝试内置镜像)
      - MAA_RESOURCE_MIRROR=https://ghfast.top/
      # 无交互登录: 填入登录后获得的 token(也可起来后在网页控制台登录)
      # - NETEASE_TOKEN=your-token-here
      # 自动拉取 MAA: 1=缺失时拉取(默认) / 0=关闭 / force=强制更新到最新版
      # - MAA_AUTO_PULL=1
    volumes:
      # MAA 核心与资源(首次启动自动拉取; 删除该目录可用于重新拉取)
      - ./maa_data:/app/maa_data
      # 运行时状态(设置/token/账号配置/日志): 容器重建(更新)后不丢失
      - ./data:/app/data
    restart: unless-stopped
